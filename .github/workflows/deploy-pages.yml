name: Deploy Prima-Hydro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prima-hydro
    steps:
      - uses: actions/checkout@v6

      # Rejestruje / naprawia konfigurację Pages – bez tego deploy bywa 404
      - uses: actions/configure-pages@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prima-hydro/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          DEPLOY_BASE: /Maciej-Projects/

      # SPA fallback – bezpośrednie wejście na /admin nie zwraca 404
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: prima-hydro/dist

  deploy:
    needs: build
    # Środowisko github-pages wpuszcza tylko gałąź main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
