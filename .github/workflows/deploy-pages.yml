name: Deploy Prima-Hydro to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'prima-hydro/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prima-hydro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prima-hydro/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          DEPLOY_BASE: /Maciej-Projects/

      # SPA fallback – dzięki temu bezpośrednie wejście na /admin nie zwraca 404
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: prima-hydro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
